name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/dotnet
        df -h

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git libffi-dev libssl-dev libltdl-dev \
          python3-setuptools python3-pip libsqlite3-dev zlib1g-dev \
          zip unzip wget
        pip install --upgrade pip setuptools
        pip install buildozer cython==0.29.33

    - name: Accept Licenses and Build
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        printf "8933b532284cd507111138029b350357c45e13e7\n24333735771371f44e17807505007f78755b9b94\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333735771371f44e17807505007f78755b9b94" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        yes | buildozer -v android debug || (echo "y" | buildozer -v android debug)

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bedrocksprite-apk
        path: bin/*.apk
